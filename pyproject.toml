[project]
name = "halo"
version = "0.1.0"
description = "HALO"
requires-python = ">=3.11"
dependencies = [
    "admet-ai>=1.4.0",
    "datamol>=0.12.5",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "medchem>=2.0.5",
    "numpy>=1.26.4",
    "openai>=2.54.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytdc>=1.1.15",
    "pyyaml>=6.0.0",
    "requests>=2.32.5",
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    "setuptools>=80.10.2,<81",
    "supabase>=2.27.2",
    "typer>=0.25.1",
]

[project.scripts]
halo = "halo.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
